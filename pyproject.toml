[project]
name = "graphrag"
description = "Graph RAG over a Neo4j knowledge graph with private per-visitor document workspaces"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
dynamic = ["version"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["venv", "data"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (unused imports, undefined names)
    "I",        # import order
    "B",        # likely bugs
    "UP",       # modern Python syntax
    "S",        # security checks
    "C4",       # comprehension clarity
    "SIM",      # simplifications
]
ignore = [
    "S101",     # assert is fine in tests
    "E501",     # long lines are handled by the formatter
    "B008",     # FastAPI dependencies and File() are called in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311"]  # fake secrets and temp paths in tests
"tests/conftest.py" = ["E402"]                 # env vars must be set before graphrag is imported
"scripts/*" = ["S608"]                         # scripts are not user-facing

[tool.coverage.run]
source = ["graphrag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
